<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10110f"><title>NowPlaying — Projector</title><link rel="stylesheet" href="style.css"></head>
<body class="display projector">
<div class="artist-backdrop" id="artistBackdrop" aria-hidden="true"></div>
<header class="topbar"><span class="clock" id="clock">--:--</span><button class="back" id="backBtn" aria-label="Back to setup">← Setup</button></header>
<main class="display-wrap">
  <section class="player">
    <img id="cover" class="cover" alt="Album artwork" src="placeholder.svg">
    <div class="details">
      <p class="eyebrow" id="state">NOW PLAYING</p>
      <h1 id="track">Waiting for playback</h1>
      <p id="artist" class="artist">Start playing something on Spotify.</p>
      <div class="lyrics" id="lyrics" hidden>
        <p id="prevLyric" class="lyric dim"></p><p id="currentLyric" class="lyric current"></p><p id="nextLyric" class="lyric dim"></p>
      </div>
      <div class="progress"><div id="bar"></div></div>
      <div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
      <div class="controls"><button id="playPauseBtn" class="control primary" aria-label="Pause" title="Play / pause"><span id="playPauseIcon" class="icon-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 5h3.8v14H7.5zM15 5h3.8v14H15z" fill="currentColor"/></svg></span></button><button id="nextBtn" class="control" aria-label="Next track" title="Next track"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5v13L14 12 4 5.5zm10 0v13l7-6.5-7-6.5z" fill="currentColor"/></svg></button><span class="control-label">Playback controls</span></div>
      <p id="message" class="message" role="status"></p>
    </div>
  </section>
</main><aside class="queue-card empty" id="queueCard"><img id="queueCover" class="queue-cover" src="placeholder.svg" alt=""><div class="queue-copy"><div class="queue-label">Up next</div><div id="queueTitle" class="queue-title">Checking queue…</div><div id="queueArtist" class="queue-artist">Spotify queue</div></div></aside><script src="display.js"></script></body></html>
