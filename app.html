<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080a0d"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="pwa-icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="pwa-icon.svg"><title>NowPlaying — Desktop</title><link rel="stylesheet" href="style.css"></head>
<body class="display desktop">
<div class="artist-backdrop" id="artistBackdrop" aria-hidden="true"></div>
<header class="topbar"><span class="clock" id="clock">--:--</span><div class="topbar-actions"><button class="back" id="backBtn" aria-label="Back to setup">← Setup</button><button class="vinyl-mode-toggle" id="vinylModeBtn" type="button" aria-pressed="false">Vinyl mode</button><span id="sourceBadge" class="source-badge" hidden aria-label="Current playback source"><img id="sourceBadgeIcon" alt="" src="" /></span></div></header>
<main class="display-wrap">
  <section class="player">
    <img id="cover" class="cover" alt="Album artwork" src="placeholder.svg">
    <div class="details">
      <h1 id="track">Waiting for playback</h1>
      <p id="artist" class="artist">Start playing something on Spotify or Plex.</p><p id="mediaMeta" class="media-meta" hidden></p>
      <div class="lyrics" id="lyrics" hidden>
        <p id="prevLyric" class="lyric dim"></p><p id="currentLyric" class="lyric current"></p><p id="nextLyric" class="lyric dim"></p>
      </div>
      <div class="progress"><div id="bar"></div></div>
      <div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
      <div class="controls"><button id="playPauseBtn" class="control primary" aria-label="Pause" title="Play / pause"><span id="playPauseIcon" class="icon-wrap"></span></button><button id="nextBtn" class="control" aria-label="Next track" title="Next track"><span class="icon-wrap" id="nextIcon"></span></button></div>
      <p id="message" class="message" role="status"></p>
    </div>

  </section>
  <aside class="queue-card empty" id="queueCard"><img id="queueCover" class="queue-cover" src="placeholder.svg" alt=""><div class="queue-copy"><div class="queue-label">Up next</div><div id="queueTitle" class="queue-title">Checking queue…</div><div id="queueArtist" class="queue-artist">Spotify queue</div></div></aside>
</main>
<section class="vinyl-stage" id="vinylStage" aria-label="Spotify vinyl player" hidden>
  <div class="vinyl-art-stack">
    <button class="vinyl-next-sleeve" id="vinylNextSleeve" type="button" aria-label="Play next queued track" title="Play this queued track"><img id="vinylNextCover" src="placeholder.svg" alt="Next queued album cover"><span class="vinyl-next-hint">UP NEXT · TAP TO PLAY</span></button>
    <div class="vinyl-current-sleeve" id="vinylCurrentSleeve"><img id="vinylCurrentCover" src="placeholder.svg" alt="Current album cover"><div class="vinyl-sleeve-shade"></div><div class="vinyl-edge-label"><span id="vinylTrack">Waiting for playback</span><span id="vinylArtist">Spotify</span></div></div>
  </div>
  <div class="vinyl-right-column"><div class="vinyl-turntable">
    <button class="vinyl-record-button" id="vinylRecordButton" type="button" aria-label="Play or pause"><span class="vinyl-record"><span class="vinyl-grooves"></span><span class="vinyl-label"><span class="vinyl-label-title" id="vinylLabelTitle">NOW PLAYING</span><span class="vinyl-spindle"></span></span></span></button>
    <div class="vinyl-tonearm" id="vinylTonearm" aria-hidden="true"><svg viewBox="0 0 160 360" preserveAspectRatio="none"><circle class="tonearm-pivot" cx="120" cy="42" r="31"/><path class="tonearm-shaft" d="M120 42 L43 268"/><path class="tonearm-head" d="M43 268 L29 291 L49 302 L63 280 L43 268 Z"/><path class="tonearm-stylus" d="M48 300 L61 308"/></svg></div>
  </div><div class="vinyl-lyrics" aria-live="polite"><p id="vinylPrevLyric" class="vinyl-lyric dim"></p><p id="vinylCurrentLyric" class="vinyl-lyric current">Lyrics will appear here when available.</p><p id="vinylNextLyric" class="vinyl-lyric dim"></p></div></div>
</section>
<section id="screensaverCaption" class="screensaver-caption" hidden><div id="screensaverTitle" class="screensaver-title"></div><div id="screensaverYear" class="screensaver-year"></div></section><script src="display.js"></script><script src="plex-display.js"></script><script src="vinyl-mode.js"></script><script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(console.error)); }</script></body></html>
