services:
  nowplaying-bridge:
    build: .
    container_name: nowplaying-bridge
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      PORT: 8787
      TAUTULLI_URL: ${TAUTULLI_URL}
      TAUTULLI_API_KEY: ${TAUTULLI_API_KEY}
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-https://shah-do.github.io}
    ports:
      - "8787:8787"
